<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f5f7fb;color:#111827;font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
#root{min-height:100vh}

.boot{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:linear-gradient(135deg,#111827,#2563eb);
}
.boot-card{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:24px;
  padding:32px 24px;
  text-align:center;

}
.logo{
  width:72px;height:72px;
  border-radius:20px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111827;
  color:white;
  font-size:35px;
}
.boot h1{margin:18px 0 6px}
.boot p{color:#6b7280;margin:0}
.spin{
  width:30px;height:30px;
  border:3px solid #e5e7eb;
  border-top-color:#2563eb;
  border-radius:50%;

  margin:22px auto 0;

.app{min-height:100vh;padding-bottom:78px}
.top{
  position:sticky;
  top:0;
  z-index:20;
  background:#fff;

}
.top-inner{
  max-width:1100px;

}
.brand{

}
.brand-logo{
  width:42px;height:42px;
  border-radius:12px;
  background:#111827;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}
.brand strong{font-size:19px}
.brand small{display:block;color:#6b7280;margin-top:2px}
.search{
  width:100%;
  margin-top:12px;
  border:1px solid #d1d5db;
  border-radius:13px;
  padding:12px 14px;
  outline:none;
  background:#f9fafb;
}
.search:focus{border-color:#2563eb;background:#fff}

.container{
  max-width:1100px;
  margin:auto;
  padding:16px;
}
.hero{
  background:linear-gradient(135deg,#111827,#2563eb);
  color:white;
  border-radius:22px;
  padding:25px 20px;
  margin-bottom:18px;
}
.hero h1{margin:0 0 8px;font-size:27px}

.hero button{
  border:0;
  background:white;

  padding:11px 17px;

  font-weight:700;
}

.section-title{
  display:flex;
  align-items:center;

  margin:20px 0 12px;
}
.section-title h2{font-size:19px;margin:0}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;

}
.cat{

  border:1px solid #e5e7eb;

}
.cat.active{

  color:white;
}
.cat-icon{font-size:24px;margin-bottom:5px}

.products{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));

}
.card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:17px;
  overflow:hidden;
}
.pic{
  height:170px;
  background:#f3f4f6;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.pic img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.noimg{font-size:42px}
.card-body{padding:12px}
.card h3{
  font-size:15px;
  margin:0 0 7px;
  line-height:1.3;
}
.price{
  font-size:18px;
  font-weight:800;
}
.mrp{
  color:#9ca3af;
  text-decoration:line-through;
  font-size:12px;
  margin-left:5px;
}
.buy{
  width:100%;
  border:0;
  background:#111827;
  color:white;
  border-radius:10px;
  padding:10px;
  margin-top:10px;
  font-weight:700;
}
.wish{
  float:right;
  border:0;
  background:transparent;
  font-size:20px;
}

.empty{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:30px 18px;
  text-align:center;
  color:#6b7280;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:30;
  background:white;
  border-top:1px solid #e5e7eb;
}
.nav{
  max-width:600px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
}
.nav button{
  border:0;
  background:white;
  padding:10px 5px 8px;
  color:#6b7280;
  font-size:12px;
}
.nav button.active{
  color:#2563eb;
  font-weight:700;
}
.nav-icon{display:block;font-size:21px;margin-bottom:2px}

.notice{
  margin:12px 0;
  padding:11px 13px;
  border-radius:11px;
  background:#fff7ed;
  color:#9a3412;
  font-size:13px;
}

.page-card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:20px;
  margin-bottom:14px;
}
.page-card h2{margin-top:0}
.action{
  width:100%;
  padding:12px;
  border:0;
  border-radius:11px;
  background:#111827;
  color:white;
  font-weight:700;
  margin-top:10px;
}

@media(min-width:700px){
  .products{grid-template-columns:repeat(4,minmax(0,1fr))}
  .pic{height:210px}
}
</style>
</head>

<script>
(function(){

"use strict";

/* ================================
   ZENTRACART CONFIG
================================ */

var SUPABASE_URL = "https://vifxsulzansmxuyiakaz.supabase.co";

var SUPABASE_KEY =
"sb_publishable_zxIYvmSfDLtP5APEw2pNdQ_bld_R_gE";

/* ================================
   SAFE SCRIPT LOADER
================================ */

function loadScript(src, timeout){
  return new Promise(function(resolve,reject){

    var done=false;
    var s=document.createElement("script");

    function finish(error){
      if(done)return;
      done=true;
      clearTimeout(timer);

      if(error) reject(error);
      else resolve();
    }

    s.src=src;
    s.async=false;

    s.onload=function(){
      finish();
    };

    s.onerror=function(){
      finish(new Error("Could not load "+src));
    };

    var timer=setTimeout(function(){
      finish(new Error("Timeout loading "+src));
    },timeout || 10000);

    document.head.appendChild(s);
  });
}

/* ================================
   VANILLA FALLBACK
   Website will NEVER stay stuck
================================ */

function showFallback(message){

  var root=document.getElementById("root");

  root.innerHTML=
  '<div class="app">'+
    '<header class="top">'+
      '<div class="top-inner">'+
        '<div class="brand">'+
          '<div class="brand-logo">🛍️</div>'+
          '<div>'+
            '<strong>ZentraCart</strong>'+
            '<small>Smart Shopping. Better Deals.</small>'+
          '</div>'+
        '</div>'+
        '<input class="search" placeholder="Search products..." disabled>'+
      '</div>'+
    '</header>'+

    '<main class="container">'+

      '<section class="hero">'+
        '<h1>Welcome to ZentraCart</h1>'+
        '<p>Smart Shopping. Better Deals.</p>'+
        '<button onclick="location.reload()">Refresh</button>'+
      '</section>'+

      (message ?
      '<div class="notice">'+message+'</div>' : '')+

      '<div class="section-title">'+
        '<h2>Shop by Category</h2>'+
      '</div>'+

      '<div class="categories">'+
        '<div class="cat"><div class="cat-icon">🎧</div>Earbuds</div>'+
        '<div class="cat"><div class="cat-icon">⌚</div>Smart Watch</div>'+
        '<div class="cat"><div class="cat-icon">👟</div>Shoes</div>'+
        '<div class="cat"><div class="cat-icon">👕</div>Fashion</div>'+
        '<div class="cat"><div class="cat-icon">📱</div>Mobile</div>'+
      '</div>'+

      '<div class="section-title">'+
        '<h2>Products</h2>'+
      '</div>'+

      '<div class="empty">'+
        '<div style="font-size:42px">🛒</div>'+
        '<h3>ZentraCart Marketplace</h3>'+
        '<p>Products will appear here after sellers add products and they are approved by the marketplace.</p>'+
      '</div>'+

    '</main>'+
  '</div>'+

  '<nav class="bottom">'+
    '<div class="nav">'+
      '<button class="active"><span class="nav-icon">⌂</span>Home</button>'+
      '<button><span class="nav-icon">▦</span>Categories</button>'+
      '<button><span class="nav-icon">🛒</span>Cart</button>'+
      '<button><span class="nav-icon">👤</span>Account</button>'+
    '</div>'+
  '</nav>';

}

/* ================================
   LOAD APP
================================ */

async function boot(){

  try{

    /*
      React first.
      If CDN fails, fallback screen appears
      instead of infinite loading.
    */

    await loadScript(
      "https://unpkg.com/react@18/umd/react.production.min.js",
      10000
    );

    await loadScript(
      "https://unpkg.com/react-dom@18/umd/react-dom.production.min.js",
      10000
    );

    await loadScript(
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
      10000
    );

    if(!window.React || !window.ReactDOM){
      throw new Error("React failed to initialize.");
    }

    if(!window.supabase){
      throw new Error("Supabase failed to initialize.");
    }

    start();

  }catch(error){

    console.error("ZentraCart boot error:",error);

    showFallback(
      "Marketplace services are taking longer than expected. The website is open, but live products could not be loaded right now."
    );

  }

}

/* ================================
   REACT APP
================================ */

function start(){

  var React=window.React;
  var ReactDOM=window.ReactDOM;
  var h=React.createElement;

  var useState=React.useState;
  var useEffect=React.useEffect;

  var sb=window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  function App(){

    var state=useState("home");
    var tab=state[0];
    var setTab=state[1];

    var ps=useState([]);
    var products=ps[0];
    var setProducts=ps[1];

    var ls=useState(true);
    var loading=ls[0];
    var setLoading=ls[1];

    var qs=useState("");
    var q=qs[0];
    var setQ=qs[1];

    var cs=useState("All");
    var cat=cs[0];
    var setCat=cs[1];

    var ss=useState(null);
    var session=ss[0];
    var setSession=ss[1];

    var ms=useState("");
    var msg=ms[0];
    var setMsg=ms[1];

    var cartState=useState([]);
    var cart=cartState[0];
    var setCart=cartState[1];

    var wishState=useState([]);
    var wish=wishState[0];
    var setWish=wishState[1];

    useEffect(function(){

      var mounted=true;

      sb.auth.getSession()
        .then(function(result){

          if(!mounted)return;

          if(result && result.data){
            setSession(result.data.session || null);
          }

        })
        .catch(function(error){
          console.log("Session:",error);
        });

      var listener=sb.auth.onAuthStateChange(
        function(event,newSession){

          if(mounted){
            setSession(newSession || null);
          }

        }
      );

      return function(){

        mounted=false;

        if(
          listener &&
          listener.data &&
          listener.data.subscription
        ){
          listener.data.subscription.unsubscribe();
        }

      };

    },[]);

    useEffect(function(){
      loadProducts();
    },[]);

    async function loadProducts(){

      setLoading(true);

      try{

        var queryPromise=
          sb
          .from("products")
          .select(
            "id,name,description,price,mrp,discount_percent,category,image_url,stock,status,brand,category_id,seller_id"
          )
          .eq("status","approved")
          .order("created_at",{ascending:false});

        var timeoutPromise=new Promise(function(_,reject){

          setTimeout(function(){
            reject(new Error("Supabase request timed out."));
          },8000);

        });

        var result=await Promise.race([
          queryPromise,
          timeoutPromise
        ]);

        if(result.error){
          throw result.error;
        }

        setProducts(result.data || []);
        setMsg("");

      }catch(error){

        console.error("Products:",error);

        setProducts([]);

        setMsg(
          "Live products are not available yet. Sellers can add products after the marketplace backend is configured."
        );

      }finally{

        setLoading(false);

      }

    }

    function addCart(product){

      setCart(function(old){

        var exists=old.find(function(x){
          return x.id===product.id;
        });

        if(exists){

          return old.map(function(x){

            if(x.id===product.id){
              return Object.assign({},x,{
                qty:(x.qty || 1)+1
              });
            }

            return x;

          });

        }

        return old.concat([
          Object.assign({},product,{qty:1})
        ]);

      });

      setMsg("Product added to cart.");

    }

    function toggleWish(product){

      setWish(function(old){

        var exists=old.some(function(x){
          return x.id===product.id;
        });

        if(exists){

          return old.filter(function(x){
            return x.id!==product.id;
          });

        }

        return old.concat([product]);

      });

    }

    function categories(){

      var list=[
        ["All","🛍️"],
        ["Electronics","📱"],
        ["Fashion","👕"],
        ["Shoes","👟"],
        ["Watches","⌚"],
        ["Home","🏠"],
        ["Toys","🧸"],
        ["Books","📚"]
      ];

      return h(
        "div",
        {className:"categories"},

        list.map(function(item){

          return h(
            "button",
            {
              key:item[0],
              className:"cat "+(cat===item[0]?"active":""),
              onClick:function(){
                setCat(item[0]);
                setTab("home");
              }
            },

            h("div",{className:"cat-icon"},item[1]),
            h("div",null,item[0])

          );

        })

      );

    }

    function productCard(p){

      var wished=wish.some(function(x){
        return x.id===p.id;
      });

      return h(
        "div",
        {className:"card",key:p.id},

        h(
          "div",
          {className:"pic"},

          p.image_url ?

          h("img",{
            src:p.image_url,
            alt:p.name,
            loading:"lazy",
            onError:function(e){
              e.currentTarget.style.display="none";
            }
          })

          :

          h("div",{className:"noimg"},"🛍️")

        ),

        h(
          "div",
          {className:"card-body"},

          h(
            "button",
            {
              className:"wish",
              title:"Wishlist",
              onClick:function(){
                toggleWish(p);
              }
            },
            wished ? "❤️" : "♡"
          ),

          h("h3",null,p.name || "Product"),

          p.brand ?
          h(
            "div",
            {
              style:{
                color:"#6b7280",
                fontSize:"12px",
                marginBottom:"6px"
              }
            },
            p.brand
          )
          : null,

          p.price!=null ?

          h(
            "div",
            {className:"price"},

            "₹"+Number(p.price).toLocaleString("en-IN"),

            p.mrp && Number(p.mrp)>Number(p.price) ?

            h(
              "span",
              {className:"mrp"},
              "₹"+Number(p.mrp).toLocaleString("en-IN")
            )

            : null

          )

          : null,

          h(
            "button",
            {
              className:"buy",
              onClick:function(){
                addCart(p);
              }
            },
            "Add to Cart"
          )

        )

      );

    }

    function Home(){

      var filtered=products.filter(function(p){

        var categoryOk=
          cat==="All" ||
          !p.category ||
          String(p.category).toLowerCase()===cat.toLowerCase();

        var searchOk=
          !q ||
          String(p.name||"").toLowerCase().includes(q.toLowerCase()) ||
          String(p.brand||"").toLowerCase().includes(q.toLowerCase());

        return categoryOk && searchOk;

      });

      return h(
        "main",
        {className:"container"},

        h(
          "section",
          {className:"hero"},

          h("h1",null,"Smart Shopping. Better Deals."),

          h(
            "p",
            null,
            "Discover products from sellers on ZentraCart."
          ),

          h(
            "button",
            {
              onClick:function(){
                document.getElementById("products")?.scrollIntoView({
                  behavior:"smooth"
                });
              }
            },
            "Shop Now"
          )

        ),

        msg ?
        h("div",{className:"notice"},msg)
        : null,

        h(
          "div",
          {className:"section-title"},
          h("h2",null,"Shop by Category")
        ),

        categories(),

        h(
          "div",
          {
            className:"section-title",
            id:"products"
          },
          h(
            "h2",
            null,
            loading ? "Loading Products…" : "Products"
          )
        ),

        loading ?

        h(
          "div",
          {className:"empty"},
          h("div",{className:"spin"}),
          h("p",null,"Loading approved products…")
        )

        :

        filtered.length ?

        h(
          "div",
          {className:"products"},
          filtered.map(productCard)
        )

        :

        h(
          "div",
          {className:"empty"},

          h(
            "div",
            {style:{fontSize:"45px"}},
            "🛒"
          ),

          h("h3",null,"No products available yet"),

          h(
            "p",
            null,
            q ?
            "No product matched your search."
            :
            "Products will appear here after sellers add products and admin approves them."
          )

        )

      );

    }

    function Categories(){

      return h(
        "main",
        {className:"container"},

        h(
          "div",
          {className:"page-card"},

          h("h2",null,"Categories"),

          h(
            "p",
            null,
            "Choose a category to explore products."
          ),

          categories()

        )

      );

    }

    function Cart(){

      var total=cart.reduce(function(sum,item){

        return sum+
          (Number(item.price)||0)*
          (Number(item.qty)||1);

      },0);

      return h(
        "main",
        {className:"container"},

        h(
          "div",
          {className:"section-title"},
          h("h2",null,"Your Cart")
        ),

        cart.length ?

        h(
          "div",
          null,

          cart.map(function(item){

            return h(
              "div",
              {
                className:"page-card",
                key:item.id
              },

              h(
                "div",
                {
                  style:{
                    display:"flex",
                    gap:"12px",
                    alignItems:"center"
                  }
                },

                h(
                  "div",
                  {
                    style:{
                      width:"70px",
                      height:"70px",
                      background:"#f3f4f6",
                      borderRadius:"12px",
                      overflow:"hidden",
                      display:"flex",
                      alignItems:"center",
                      justi
