<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#111827"/><meta name="description" content="ZentraCart — Smart Shopping. Better Deals."/><link rel="manifest" href="./manifest.webmanifest"/><link rel="icon" href="./icon.svg"/><title>ZentraCart — Smart Shopping. Better Deals.</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f7fb;color:#111827}.app{max-width:1100px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;padding:14px;border-radius:18px;position:sticky;top:8px;z-index:5;box-shadow:0 4px 20px #00000010}.brand{font-size:22px;font-weight:800}.brand small{display:block;font-size:11px;font-weight:500;color:#667085;margin-left:29px}select,input,button{font:inherit}select{padding:10px;border-radius:10px;border:1px solid #ddd}.hero{margin:16px 0;padding:24px;border-radius:22px;background:linear-gradient(135deg,#111827,#374151);color:#fff}.hero h1{margin:0 0 8px}.hero p{opacity:.85}.search{display:flex;gap:8px}.search input{flex:1;padding:13px;border:0;border-radius:12px}.search button,.chips button,.actions button,.buy{border:0;border-radius:10px;padding:10px 13px;cursor:pointer}.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.chips button{white-space:nowrap;background:#fff;border:1px solid #ddd}.chips .active{background:#111827;color:#fff}.bar{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px #0000000d}.card img{width:100%;height:180px;object-fit:cover}.pad{padding:12px}.tag{font-size:12px;color:#667085}.card h3{margin:6px 0}.actions{display:flex;gap:8px;margin:10px 0}.actions button:first-child{flex:1;background:#111827;color:#fff}.buy{width:100%;background:#16a34a;color:#fff}.modules{background:#fff;margin:18px 0;padding:16px;border-radius:18px}.modules>div{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.modules span{padding:9px;background:#f3f4f6;border-radius:9px}.dashboard{padding:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stats div{background:#fff;padding:15px;border-radius:14px}.stats strong{display:block;font-size:24px;margin-top:6px}.notice{margin-top:14px;padding:14px;background:#fff7ed;border-radius:12px}footer{text-align:center;padding:20px;color:#667085}.social{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}.social a{color:#111827;text-decoration:none;font-weight:700;padding:7px 10px;border:1px solid #cbd5e1;border-radius:999px}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.brand{font-size:18px}}
</style></head><body><div id="root"></div><script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script type="text/babel">
const {useEffect,useMemo,useState}=React;const WA='919012146956';const categories=['All','Earbuds','Headphones','Mobiles','Fashion','Shoes','Watches','Chargers','Toys','Home & Kitchen','Books','Bags'];const products=[{id:1,name:'Wireless TWS Earbuds',cat:'Earbuds',price:549,img:'https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?auto=format&fit=crop&w=700&q=80'},{id:2,name:'Smart Calling Watch',cat:'Watches',price:899,img:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=700&q=80'},{id:3,name:'Bluetooth Headphones',cat:'Headphones',price:799,img:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=700&q=80'},{id:4,name:'Mobile & Tablet Stand',cat:'Home & Kitchen',price:204,img:'https://images.unsplash.com/photo-1586953208448-b95a79798f07?auto=format&fit=crop&w=700&q=80'},{id:5,name:'Men Casual T-Shirt',cat:'Fashion',price:399,img:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=700&q=80'},{id:6,name:'Ladies Fashion Shoes',cat:'Shoes',price:699,img:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80'}];
function App(){const[role,setRole]=useState('buyer'),[q,setQ]=useState(''),[cat,setCat]=useState('All'),[cart,setCart]=useState([]),[wish,setWish]=useState([]);useEffect(()=>{if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})},[]);const filtered=useMemo(()=>products.filter(p=>(cat==='All'||p.cat===cat)&&p.name.toLowerCase().includes(q.toLowerCase())),[q,cat]);const add=p=>setCart(c=>[...c,p]);const wa=p=>location.href=`https://wa.me/${WA}?text=${encodeURIComponent('Hello! I want to order: '+p.name+' from ZentraCart.')}`;return <div className="app"><header><div className="brand">🛒 <span>ZentraCart</span><small>Smart Shopping. Better Deals.</small></div><select value={role} onChange={e=>setRole(e.target.value)}><option value="buyer">Buyer App</option><option value="seller">Seller Panel</option><option value="admin">Admin Panel</option></select></header>{role==='buyer'?<><section className="hero"><h1>Shop Smart. Get Better Deals.</h1><p>COD + UPI ready architecture • Seller marketplace • Mobile-first PWA</p><div className="search"><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search products..."/><button>🔎</button></div></section><div className="chips">{categories.map(c=><button className={cat===c?'active':''} onClick={()=>setCat(c)} key={c}>{c}</button>)}</div><main><div className="bar"><h2>Products</h2><span>Cart: {cart.length} • Wishlist: {wish.length}</span></div><div className="grid">{filtered.map(p=><article className="card" key={p.id}><img src={p.img}/><div className="pad"><span className="tag">{p.cat}</span><h3>{p.name}</h3><b>₹{p.price}</b><div className="actions"><button onClick={()=>add(p)}>Add to cart</button><button onClick={()=>setWish(w=>w.includes(p.id)?w.filter(x=>x!==p.id):[...w,p.id])}>♡</button></div><button className="buy" onClick={()=>wa(p)}>Buy Now ZentraCart</button></div></article>)}</div></main><section className="modules"><h2>Buyer features</h2><div>{['Account create/login','Mobile/email verification','Home + categories','Search & filters','Product details/images/variants','Cart + wishlist','Address management','COD + UPI/online payment','Order placement/history','Order tracking','Cancel/return/refund','Reviews & ratings','Notifications','Buyer profile'].map(x=><span key={x}>✓ {x}</span>)}</div></section></>:role==='seller'?<Dashboard title="Seller Panel" items={['Seller registration/login','Seller profile/store','Add/edit/delete products','Product images','Price, stock, SKU','Categories & variants','Product listing + approval','Seller dashboard','New/confirmed/shipped/delivered orders','Sales/revenue reports','Return/refund management','Customer/order details','Seller notifications','Commission calculation','Payout information']}/>:<Dashboard title="Admin Panel" items={['Admin login','Seller approval/rejection','Buyer management','Product approval/rejection','Categories','Orders','Returns/refunds','Seller commission','Payout management','Coupons/offers','Banners','Reviews moderation','Reports/analytics','Site/app settings']}/>}<footer>© ZentraCart • WhatsApp orders: +91 90121 46956<div className="social"><strong>Follow us on:</strong><a href="https://www.instagram.com/zentracart/" target="_blank">Instagram — @zentracart</a><a href="https://www.youtube.com/@ZentraCart_store" target="_blank">YouTube — ZentraCart</a></div></footer></div>};function Dashboard({title,items}){return <main className="dashboard"><h1>{title}</h1><p>Marketplace control center</p><div className="stats"><div>Orders<strong>0</strong></div><div>Products<strong>0</strong></div><div>Revenue<strong>₹0</strong></div><div>Pending<strong>0</strong></div></div><div className="modules"><h2>Modules</h2><div>{items.map(x=><span key={x}>✓ {x}</span>)}</div></div><div className="notice">Connect the backend API and database from the marketplace project to turn these modules into live operations.</div></main>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
