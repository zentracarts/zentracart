function saveCart(){localStorage.setItem('zc_cart',JSON.stringify(cart));updateCounts()}
function updateCounts(){let n=cart.reduce((a,x)=>a+x.qty,0);$('cartCount').textContent=n;$('cartCount2').textContent=n}
function show(id){['home','cart','orders','account','seller','admin'].forEach(x=>$(x).classList.toggle('hide',x!==id));if(id==='home')renderHome();if(id==='cart')renderCart();if(id==='orders')renderOrders();if(id==='account')renderAccount();if(id==='seller')renderSeller();if(id==='admin')renderAdmin();scrollTo(0,0)}

async function loadSession(){let r=await db.auth.getSession();user=r.data.session?.user||null;if(user){let p=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=p.data||null}}

function productCard(p){return `<article class="card"><img class="pic" src="${esc(p.image_url||'https://placehold.co/600x500?text=ZentraCart')}" onerror="this.src='https://placehold.co/600x500?text=ZentraCart'"><div class="info"><div class="muted">${esc(p.brand||p.category||'ZentraCart')}</div><div class="name">${esc(p.name)}</div><div class="price">${money(p.price)} ${p.mrp?`<span class="mrp">${money(p.mrp)}</span>`:''}${p.discount_percent?`<span class="off">${esc(p.discount_percent)}% off</span>`:''}</div><div class="muted">Stock: ${Number(p.stock||0)}</div><div class="actions"><button class="btn light" onclick="details('${p.id}')">View</button><button class="btn primary" onclick="addCart('${p.id}')">Add to Cart</button></div></div></article>`}
function renderHome(){renderCats();let list=filtered();$('productGrid').innerHTML=list.length?list.map(productCard).join(''):'<div class="panel empty">No products found.</div>'}
function details(id){let p=products.find(x=>x.id===id);if(!p)return;openModal(p.name,`<img src="${esc(p.image_url||'https://placehold.co/700x500?text=ZentraCart')}" style="width:100%;max-height:300px;object-fit:contain;border-radius:12px"><p>${esc(p.description||'No description')}</p><h2>${money(p.price)}</h2><p>Brand: ${esc(p.brand||'-')}<br>Stock: ${p.stock}</p><button class="btn primary" onclick="addCart('${p.id}');closeModal()">Add to Cart</button>`)}
function addCart(id){let p=products.find(x=>x.id===id);if(!p||p.stock<1)return toast('Out of stock');let x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id,qty:1});saveCart();toast('Added to cart')}
function removeCart(id){cart=cart.filter(x=>x.id!==id);saveCart();renderCart()}
function renderCart(){if(!cart.length){$('cartBox').innerHTML='<div class="panel empty">Your cart is empty.</div>';return}let total=0;let html=cart.map(x=>{let p=products.find(p=>p.id===x.id);if(!p)return '';let line=Number(p.price)*x.qty;total+=line;return `<div class="panel"><div class="row"><img src="${esc(p.image_url||'https://placehold.co/100')}" style="width:65px;height:65px;object-fit:cover;border-radius:8px"><div><b>${esc(p.name)}</b><br>${money(p.price)} × ${x.qty}</div><button class="btn danger" onclick="removeCart('${p.id}')">Remove</button></div></div>`}).join('');$('cartBox').innerHTML=html+`<div class="panel"><h3>Total ${money(total)}</h3><button class="btn green" onclick="checkout()">Checkout</button></div>`}
async function checkout(){if(!user){openAuth();return}if(!cart.length)return toast('Cart is empty');let r=await db.from('addresses').select('*').eq('buyer_id',user.id).order('is_default',{ascending:false});if(r.error)return toast('Address load failed');let a=r.data?.[0];if(!a){openAddress();return}openCheckout(a)}
function openAddress(){openModal('Add delivery address',`<div class="field"><label>Full name</label><input id="a_name"></div><div class="field"><label>Mobile</label><input id="a_phone" inputmode="tel"></div><div class="field"><label>Address</label><textarea id="a_line"></textarea></div><div class="split"><div class="field"><label>City</label><input id="a_city"></div><div class="field"><label>State</label><input id="a_state"></div></div><div class="field"><label>Pincode</label><input id="a_pin" inputmode="numeric"></div><button class="btn primary" onclick="saveAddress()">Save & Continue</button>`)}

function openCheckout(a){openModal('Checkout',`<div class="panel"><b>Delivery</b><p>${esc(a.full_name)}<br>${esc(a.phone)}<br>${esc(a.address_line)}, ${esc(a.city)}, ${esc(a.state)} - ${esc(a.Pincode)}</p></div><div class="panel"><b>Payment</b><p>Cash on Delivery</p><button class="btn green" onclick="placeCOD('${a.id}')">Place COD Order</button></div><div class="panel"><b>Online UPI</b><p class="small warn">Real gateway checkout must be enabled with a server-side payment provider. Do not put gateway secrets in this HTML.</p><button class="btn light" onclick="toast('UPI gateway setup is required before accepting real payments')">Pay Online</button></div>`)}
async function placeCOD(addressId){let s=await db.auth.getSession();let token=s.data.session?.access_token;if(!token)return toast('Login session expired');let r=await fetch(COD_FUNCTION,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({payment_method:'cod',address_id:addressId})});let out={};try{out=await r.json()}catch{}if(!r.ok){toast(out.error||'COD order failed');return}cart=[];saveCart();closeModal();toast('COD order placed');await loadProducts();show('orders')}
async function renderOrders(){if(!user){$('ordersBox').innerHTML='<div class="panel empty">Login to view orders.</div>';return}let r=await db.from('orders').select('*').eq('buyer_id',user.id).order('created_at',{ascending:false});if(r.error){$('ordersBox').innerHTML='<div class="panel">Could not load orders.</div>';return}$('ordersBox').innerHTML=r.data?.length?r.data.map(o=>`<div class="panel"><b>Order ${esc(o.order_number||o.id)}</b><p>Status: ${esc(o.order_status||o.status||'placed')}<br>Payment: ${esc(o.payment_method||'cod')} / ${esc(o.payment_status||'pending')}<br>Total: ${money(o.total_amount)}</p></div>`).join(''):'<div class="panel empty">No orders yet.</div>'}

async function signIn(){let email=$('auth_email').value,password=$('auth_pass').value,r=await db.auth.signInWithPassword({email,password});if(r.error)return toast(r.error.message);user=r.data.user;let p=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=p.data||null;closeModal();toast('Signed in');renderAccount()}
async function signUp(){let email=$('auth_email').value,password=$('auth_pass').value;if(password.length<6)return toast('Password must be at least 6 characters');let r=await db.auth.signUp({email,password,options:{data:{role:'buyer'}}});if(r.error)return toast(r.error.message);toast('Check your email to confirm account');}

utton class="btn light" onclick="faq()">Open</button></div><div class="listitem">📝 My Activity <button class="btn light" onclick="activity()">Questions & Answers</button></div><div class="listitem">📸 Profile photo <button class="btn light" onclick="toast('Upload to profile-images storage bucket after creating it')">Change</button></div><div class="listitem">Follow Us: <a class="link" href="https://instagram.com/zentracart" target="_blank">Instagram</a> · <a class="link" href="https://www.youtube.com/@ZentraCart_store" target="_blank">YouTube</a></div><div class="listitem">Professional email: <b>zentracart@gmail.com</b></div></div>`}
async function editProfile(){let name=prompt('Full name',profile?.full_name||'');if(name===null)return;let phone=prompt('Mobile number',profile?.phone||'');let r=await db.from('profiles').update({full_name:name,phone}).eq('id',user.id);if(r.error)return toast(r.error.message);profile={...profile,full_name:name,phone};renderAccount()}

async function sellerSignup(){let store=prompt('Store name');if(!store)return;let r=await db.from('seller_profiles').upsert({user_id:user.id,store_name:store});if(r.error)return toast(r.error.message);let p=await db.from('profiles').update({role:'seller'}).eq('id',user.id);if(p.error)return toast(p.error.message);profile={...profile,role:'seller'};toast('Seller profile created');renderSeller()}
async function loadSellerProducts(){let r=await db.from('products').select('*').eq('seller_id',user.id).order('created_at',{ascending:false});let html='<div class="panel"><h2>Seller Dashboard</h2><button class="btn primary" onclick="addProduct()">Add Product</button></div>';html+=(r.data||[]).map(p=>`<div class="panel"><b>${esc(p.name)}</b><p>${money(p.price)} · Stock ${p.stock} · Status ${esc(p.status)}</p><button class="btn light" onclick="editProduct('${p.id}')">Edit</button> <button class="btn danger" onclick="deleteProduct('${p.id}')">Delete</button></div>`).join('');$('sellerBox').innerHTML=html||'<div class="panel empty">No products yet.</div>'}
function addProduct(){openModal('Add product',`<div class="field"><label>Name</label><input id="p_name"></div><div class="field"><label>Description</label><textarea id="p_desc"></textarea></div><div class="split"><input id="p_price" placeholder="Price"><input id="p_mrp" placeholder="MRP"></div><div class="split"><input id="p_stock" placeholder="Stock"><input id="p_disc" placeholder="Discount %"></div><div class="split"><input id="p_brand" placeholder="Brand"><input id="p_cat" placeholder="Category"></div><div class="field"><label>Product image URL</label><input id="p_img" placeholder="Storage/public image URL"></div><button class="btn primary" onclick="saveProduct()">Submit product</button>`)}
async function saveProduct(){let v={seller_id:user.id,name:$('p_name').value,description:$('p_desc').value,price:Number($('p_price').value),mrp:Number($('p_mrp').value)||null,stock:Number($('p_stock').value)||0,discount_percent:Number($('p_disc').value)||0,brand:$('p_brand').value,category:$('p_cat').value,image_url:$('p_img').value,status:'pending'};let r=await db.from('products').insert(v);if(r.error)return toast(r.error.message);closeModal();toast('Product submitted for approval');renderSeller()}
async function editProduct(id){let r=await db.from('products').select('*').eq('id',id).eq('seller_id',user.id).single();if(r.error)return toast(r.error.message);let p=r.data;openModal('Edit product',`<div class="field"><input id="p_name" value="${esc(p.name)}"></div><div class="field"><input id="p_price" value="${p.price}"></div><div class="field"><input id="p_stock" value="${p.stock}"></div><div class="field"><input id="p_img" value="${esc(p.image_url||'')}"></div><button class="btn primary" onclick="updateProduct('${id}')">Save</button>`)}
async function updateProduct(id){let r=await db.from('products').update({name:$('p_name').value,price:Number($('p_price').value),stock:Number($('p_stock').value),image_url:$('p_img').value,status:'pending'}).eq('id',id).eq('seller_id',user.id);if(r.error)return toast(r.error.message);closeModal();renderSeller()}
async function deleteProduct(id){if(!confirm('Delete product?'))return;let r=await db.from('products').delete().eq('id',id).eq('seller_id',user.id);if(r.error)return toast(r.error.message);renderSeller()}
async function renderAdmin(){if(!user){$('adminBox').innerHTML='<div class="panel"><h2>Admin</h2><button class="btn primary" onclick="openAuth()">Sign In</button></div>';return}if(profile?.role!=='admin'){$('adminBox').innerHTML='<div class="panel">Admin access is restricted by database RLS/server-side authorization.</div>';return}let [p,o,u]=await Promise.all([db.from('products').select('*').order('created_at',{ascending:false}),db.from('orders').select('*').order('created_at',{ascending:false}),db.from('profiles').select('id,email,full_name,role,created_at')]);$('adminBox').innerHTML=`<div class="panel"><h2>Admin Dashboard</h2><p>Products: ${p.data?.length||0} · Orders: ${o.data?.length||0} · Users: ${u.data?.length||0}</p></div>`+(p.data||[]).map(x=>`<div class="panel"><b>${esc(x.name)}</b><p>Status: ${esc(x.status)}</p><button class="btn green" onclick="approve('${x.id}')">Approve</button> <button class="btn danger" onclick="reject('${x.id}')">Reject</button></div>`).join('')}
async function approve(id){let r=await db.from('products').update({status:'approved',rejection_reason:null}).eq('id',id);if(r.error)return toast(r.error.message);renderAdmin()}
async function reject(id){let reason=prompt('Rejection reason');if(reason===null)return;let r=await db.from('products').update({status:'rejected',rejection_reason:reason}).eq('id',id);if(r.error)return toast(r.error.message);renderAdmin()}
function voiceSearch(){if(!('webkitSpeechRecognition'in window))return toast('Voice search not supported');let r=new webkitSpeechRecognition();r.lang='en-IN';r.onresult=e=>{$('q').value=e.results[0][0].transcript;renderHome()};r.start()}
function cameraSearch(){toast('Camera scan UI is ready for integration; image recognition needs a vision/search service.')}
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')renderHome()});
db.auth.onAuthStateChange(async(_e,s)=>{user=s?.user||null;if(user){let p=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=p.data||null}else profile=null;renderAccount()});
(async()=>{await loadSession();await loadProducts();renderHome();updateCounts();renderAccount()})();

window.openAuth = function () {
  var modal = document.getElementById('modal');
  var title = document.getElementById('modalTitle');
  var body = document.getElementById('modalBody');

  if (!modal || !title || !body) {
    alert('ZentraCart login screen could not open.');
    return;
  }

  title.textContent = 'Sign In / Create Account';

  body.innerHTML = `
    <div class="field">
      <label>Email</label>
      <input id="auth_email" type="email" placeholder="Enter your email">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="auth_pass" type="password" placeholder="Minimum 6 characters">
    </div>

    <div class="row">
      <button class="btn primary" onclick="window.zcSignIn()">Sign In</button>
      <button class="btn light" onclick="window.zcSignUp()">Create Account</button>
    </div>

    <hr>

    <button class="btn light" style="width:100%" onclick="window.zcEmailOTP()">
      Send Email OTP / Login Link
    </button>

    <p class="small">
      Phone OTP bhi add karenge, Supabase SMS provider configure hone ke baad.
    </p>
  `;

  modal.classList.remove('hide');
};

window.zcSignIn = async function () {
  var email = document.getElementById('auth_email')?.value.trim();
  var password = document.getElementById('auth_pass')?.value;

  if (!email || !password) {
    alert('Email aur password enter karo.');
    return;
  }

  if (!window.supabase) {
    alert('Login service load nahi hui. Page refresh karke try karo.');
    return;
  }

  var client = window.db;

  if (!client) {
    client = window.supabase.createClient(
      'https://vifxsulzansmxuyiakaz.supabase.co',
      'sb_publishable_zxIYvmSfDLTtP5APEw2pNdQ_bld_R_gE'
    );
  }

  var result = await client.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (result.error) {
    alert(result.error.message);
    return;
  }

  location.reload();
};

window.zcSignUp = async function () {
  var email = document.getElementById('auth_email')?.value.trim();
  var password = document.getElementById('auth_pass')?.value;

  if (!email || !password) {
    alert('Email aur password enter karo.');
    return;
  }

  if (password.length < 6) {
    alert('Password minimum 6 characters ka hona chahiye.');
    return;
  }

  if (!window.supabase) {
    alert('Login service load nahi hui. Page refresh karke try karo.');
    return;
  }

  var client = window.db;

  if (!client) {
    client = window.supabase.createClient(
      'https://vifxsulzansmxuyiakaz.supabase.co',
      'sb_publishable_zxIYvmSfDLTtP5APEw2pNdQ_bld_R_gE'
    );
  }

  var result = await client.auth.signUp({
    email: email,
    password: password,
    options: {
      data: { role: 'buyer' }
    }
  });

  if (result.error) {
    alert(result.error.message);
    return;
  }

  alert('Account create ho gaya. Agar email confirmation enabled hai to email check karo.');
};

window.zcEmailOTP = async function () {
  var email = document.getElementById('auth_email')?.value.trim();

  if (!email) {

  }
