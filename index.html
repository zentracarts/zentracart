<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="description" content="ZentraCart — Smart Shopping. Better Deals."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>ZentraCart — Smart Shopping. Better Deals.</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f7fb;color:#111827}.app{max-width:1100px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;padding:14px;border-radius:18px;position:sticky;top:8px;z-index:5;box-shadow:0 4px 20px #00000010}.brand{font-size:22px;font-weight:800}.brand small{display:block;font-size:11px;font-weight:500;color:#667085;margin-left:29px}select,input,button{font:inherit}select,input{padding:11px;border:1px solid #d0d5dd;border-radius:10px;box-sizing:border-box}button{cursor:pointer}.hero{margin:16px 0;padding:24px;border-radius:22px;background:linear-gradient(135deg,#111827,#374151);color:#fff}.hero h1{margin:0 0 8px}.hero p{opacity:.85}.search{display:flex;gap:8px}.search input{flex:1;border:0}.search button,.chips button,.actions button,.buy,.primary{border:0;border-radius:10px;padding:10px 13px}.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.chips button{white-space:nowrap;background:#fff;border:1px solid #ddd}.chips .active{background:#111827;color:#fff}.bar{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px #0000000d}.card img{width:100%;height:180px;object-fit:cover}.pad{padding:12px}.tag{font-size:12px;color:#667085}.card h3{margin:6px 0}.actions{display:flex;gap:8px;margin:10px 0}.actions button:first-child{flex:1;background:#111827;color:#fff}.buy,.primary{width:100%;background:#16a34a;color:#fff}.panel{background:#fff;margin:18px 0;padding:18px;border-radius:18px}.form{display:grid;gap:10px}.form button{margin-top:4px}.message{padding:11px;border-radius:10px;background:#f3f4f6;margin:10px 0}.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stats div{background:#fff;padding:15px;border-radius:14px}.stats strong{display:block;font-size:24px;margin-top:6px}.modules{background:#fff;margin:18px 0;padding:16px;border-radius:18px}.modules>div{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.modules span{padding:9px;background:#f3f4f6;border-radius:9px}.dashboard{padding:8px}.notice{margin-top:14px;padding:14px;background:#fff7ed;border-radius:12px}footer{text-align:center;padding:20px;color:#667085}.social{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}.social a{color:#111827;text-decoration:none;font-weight:700;padding:7px 10px;border:1px solid #cbd5e1;border-radius:999px}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.brand{font-size:18px}}</style></head><body><div id="root"></div><script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="text/babel">
const {useEffect,useMemo,useState}=React;
const {createClient}=supabase;
const SUPABASE_URL='https://vifxsulzansmxuyiakaz.supabase.co';
const SUPABASE_KEY='sb_publishable_zxIYvmSfDLtP5APEw2pNdQ_bld_R_gE';
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
const WA='919012146956';
const categories=['All','Earbuds','Headphones','Mobiles','Fashion','Shoes','Watches','Chargers','Toys','Home & Kitchen','Books','Bags'];
const demoProducts=[{id:'d1',name:'Wireless TWS Earbuds',category:'Earbuds',price:549,image_url:'https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?auto=format&fit=crop&w=700&q=80'},{id:'d2',name:'Smart Calling Watch',category:'Watches',price:899,image_url:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=700&q=80'},{id:'d3',name:'Bluetooth Headphones',category:'Headphones',price:799,image_url:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=700&q=80'},{id:'d4',name:'Mobile & Tablet Stand',category:'Home & Kitchen',price:204,image_url:'https://images.unsplash.com/photo-1586953208448-b95a79798f07?auto=format&fit=crop&w=700&q=80'},{id:'d5',name:'Men Casual T-Shirt',category:'Fashion',price:399,image_url:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=700&q=80'},{id:'d6',name:'Ladies Fashion Shoes',category:'Shoes',price:699,image_url:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80'}];
function AuthBox({onDone}){const[email,setEmail]=useState(''),[password,setPassword]=useState(''),[name,setName]=useState(''),[mode,setMode]=useState('login'),[role,setRole]=useState('buyer'),[msg,setMsg]=useState('');const submit=async()=>{setMsg('');if(!email||!password)return setMsg('Email aur password bharna zaroori hai.');if(mode==='login'){const {data,error}=await db.auth.signInWithPassword({email,password});if(error)return setMsg(error.message);onDone(data.user)}else{const {data,error}=await db.auth.signUp({email,password});if(error)return setMsg(error.message);if(data.user){const {error:pe}=await db.from('profiles').upsert({id:data.user.id,full_name:name,role});if(pe)return setMsg(pe.message)}setMsg('Account create ho gaya. Agar email confirmation on hai to email verify karke login karo.');}};return <div className="panel"><h2>{mode==='login'?'Login':'Create account'}</h2>{mode==='signup'&&<input value={name} onChange={e=>setName(e.target.value)} placeholder="Full name"/>}<input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email"/><input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Password"/>{mode==='signup'&&<select value={role} onChange={e=>setRole(e.target.value)}><option value="buyer">Buyer account</option><option value="seller">Seller account</option></select>}<button className="primary" onClick={submit}>{mode==='login'?'Login':'Create account'}</button>{msg&&<div className="message">{msg}</div>}<button onClick={()=>{setMode(mode==='login'?'signup':'login');setMsg('')}}>{mode==='login'?'New user? Create account':'Already have an account? Login'}</button></div>}
function Buyer({session}){const[q,setQ]=useState(''),[cat,setCat]=useState('All'),[cart,setCart]=useState([]),[wish,setWish]=useState([]),[products,setProducts]=useState([]),[msg,setMsg]=useState('');useEffect(()=>{load();},[]);const load=async()=>{const {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});if(!error&&data)setProducts(data)};const list=products.length?products:demoProducts;const filtered=useMemo(()=>list.filter(p=>(cat==='All'||(p.category||p.cat)===cat)&&(p.name||'').toLowerCase().includes(q.toLowerCase())),[list,q,cat]);const wa=p=>location.href=`https://wa.me/${WA}?text=${encodeURIComponent('Hello! I want to order: '+p.name+' from ZentraCart.')}`;return <><section className="hero"><h1>Shop Smart. Get Better Deals.</h1><p>Live products from ZentraCart marketplace • COD + WhatsApp</p><div className="search"><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search products..."/><button>🔎</button></div></section><div className="chips">{categories.map(c=><button className={cat===c?'active':''} onClick={()=>setCat(c)} key={c}>{c}</button>)}</div><main><div className="bar"><h2>Products</h2><span>Cart: {cart.length} • Wishlist: {wish.length}</span></div><div className="grid">{filtered.map(p=><article className="card" key={p.id}><img src={p.image_url||p.img}/><div className="pad"><span className="tag">{p.category||p.cat||'Product'}</span><h3>{p.name}</h3><b>₹{p.price}</b><div className="actions"><button onClick={()=>setCart(c=>[...c,p])}>Add to cart</button><button onClick={()=>setWish(w=>w.includes(p.id)?w.filter(x=>x!==p.id):[...w,p.id])}>♡</button></div><button className="buy" onClick={()=>wa(p)}>Buy Now ZentraCart</button></div></article>)}</div></main>{session&&<div className="message success">Logged in: {session.user.email}</div>}</>}
function Seller({session}){const[name,setName]=useState(''),[description,setDescription]=useState(''),[price,setPrice]=useState(''),[stock,setStock]=useState(''),[category,setCategory]=useState('Fashion'),[image,setImage]=useState(''),[brand,setBrand]=useState(''),[sku,setSku]=useState(''),[discount,setDiscount]=useState(''),[mine,setMine]=useState([]),[msg,setMsg]=useState('');const load=async()=>{if(!session)return;const {data}=await db.from('products').select('*').eq('seller_id',session.user.id).order('created_at',{ascending:false});setMine(data||[])};useEffect(()=>{load()},[session]);const add=async()=>{setMsg('');if(!name||!price||!stock)return setMsg('Name, price aur stock bharna zaroori hai.');const {error}=await db.from('products').insert({seller_id:session.user.id,name,description,price:Number(price),stock:Number(stock),category,image_url:image||null,brand:brand||null,sku:sku||null,discount_percent:discount?Number(discount):0,status:'active'});if(error)return setMsg(error.message);setMsg('Product successfully add ho gaya.');setName('');setDescription('');setPrice('');setStock('');setImage('');setBrand('');setSku('');setDiscount('');load()};if(!session)return <AuthBox onDone={()=>location.reload()}/>;return <main className="dashboard"><h1>Seller Panel</h1><p>{session.user.email}</p><div className="panel"><h2>➕ Add Product</h2><div className="form"><input value={name} onChange={e=>setName(e.target.value)} placeholder="Product name"/><textarea value={description} onChange={e=>setDescription(e.target.value)} placeholder="Description" rows="3"></textarea><input type="number" value={price} onChange={e=>setPrice(e.target.value)} placeholder="Price ₹"/><input type="number" value={stock} onChange={e=>setStock(e.target.value)} placeholder="Stock"/><select value={category} onChange={e=>setCategory(e.target.value)}>{categories.filter(x=>x!=='All').map(x=><option key={x}>{x}</option>)}</select><input value={brand} onChange={e=>setBrand(e.target.value)} placeholder="Brand (optional)"/><input value={sku} onChange={e=>setSku(e.target.value)} placeholder="SKU (optional)"/><input type="number" value={discount} onChange={e=>setDiscount(e.target.value)} placeholder="Discount % (optional)"/><input value={image} onChange={e=>setImage(e.target.value)} placeholder="Product image URL (optional)"/><button className="primary" onClick={add}>Add Product</button>{msg&&<div className="message">{msg}</div>}</div></div><div className="panel"><h2>My Products ({mine.length})</h2>{mine.length?mine.map(p=><div className="message" key={p.id}><b>{p.name}</b> — ₹{p.price} — Stock {p.stock} — {p.status}</div>):<p>Abhi koi product nahi hai.</p>}</div></main>}
function Dashboard({title,items}){return <main className="dashboard"><h1>{title}</h1><p>Marketplace control center</p><div className="stats"><div>Orders<strong>0</strong></div><div>Products<strong>0</strong></div><div>Revenue<strong>₹0</strong></div><div>Pending<strong>0</strong></div></div><div className="modules"><h2>Modules</h2><div>{items.map(x=><span key={x}>✓ {x}</span>)}</div></div><div className="notice">Admin features need a secure server-side admin role. Never put an admin password or service_role key in this public HTML.</div></main>}
function App(){const[role,setRole]=useState('buyer'),[session,setSession]=useState(null);useEffect(()=>{db.auth.getSession().then(({data})=>setSession(data.session));const {data}=db.auth.onAuthStateChange((_e,s)=>setSession(s));return()=>data.subscription.unsubscribe()},[]);const logout=async()=>{await db.auth.signOut();setSession(null);};return <div className="app"><header><div className="brand">🛒 <span>ZentraCart</span><small>Smart Shopping. Better Deals.</small></div><div><select value={role} onChange={e=>setRole(e.target.value)}><option value="buyer">Buyer App</option><option value="seller">Seller Panel</option><option value="admin">Admin Panel</option></select>{session&&<button onClick={logout} style={{marginLeft:6,padding:'9px',borderRadius:10,border:'1px solid #ddd'}}>Logout</button>}</div></header>{role==='buyer'?<><Buyer session={session}/>{!session&&<AuthBox onDone={setSession}/>}</>:role==='seller'?<Seller session={session}/>:<Dashboard title="Admin Panel" items={['Admin login','Seller approval/rejection','Buyer management','Product approval/rejection','Categories','Orders','Returns/refunds','Seller commission','Payout management','Coupons/offers','Banners','Reviews moderation','Reports/analytics','Site/app settings']}/>}<footer>© ZentraCart • WhatsApp orders: +91 90121 46956<div className="social"><strong>Follow us on:</strong><a href="https://www.instagram.com/zentracart/" target="_blank">Instagram — @zentracart</a><a href="https://www.youtube.com/@ZentraCart_store" target="_blank">YouTube — ZentraCart</a></div></footer></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
