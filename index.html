<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="google-site-verification" content="uY5R0U_WUX8UdnJ2g8IBpLeVrNTeoPbYiP_e_-OgspA" /><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><meta name="description" content="ZentraCart — Smart Shopping. Better Deals."><meta name="keywords" content="ZentraCart, online shopping, earbuds, smart watch, headphones, shoes, fashion, shopping">
<link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icon.svg">
<title>ZentraCart — Smart Shopping. Better Deals.</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#111827}.top{background:#111827;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}.brand{font-size:24px;font-weight:800}.tag{font-size:11px;color:#d1d5db}.search{margin-top:10px;display:flex;gap:8px}.search input{flex:1;padding:12px;border:0;border-radius:9px}.btn{border:0;border-radius:9px;padding:11px 14px;background:#f59e0b;font-weight:700}.nav{display:flex;gap:8px;overflow:auto;padding:10px;background:#fff;position:sticky;top:78px;z-index:4}.nav button{white-space:nowrap;border:1px solid #ddd;background:#fff;padding:9px 12px;border-radius:20px}.wrap{max-width:1100px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#111827,#374151);color:#fff;padding:25px;border-radius:16px}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0 0 15px}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 10px #0000000d}.pic{height:145px;border-radius:10px;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:48px}.card h3{font-size:14px;margin:9px 0 5px}.price{font-weight:800}.old{text-decoration:line-through;color:#9ca3af;font-size:12px;margin-left:5px}.add{width:100%;margin-top:8px;background:#111827;color:#fff;border:0;padding:10px;border-radius:9px}.cats{display:flex;gap:9px;overflow:auto}.cat{min-width:105px;background:#fff;border-radius:12px;padding:12px;text-align:center}.cat div{font-size:28px}.cart{position:fixed;right:16px;bottom:18px;background:#f59e0b;border:0;border-radius:50%;width:58px;height:58px;font-size:24px;box-shadow:0 4px 15px #0004}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:10}.sheet{background:#fff;width:100%;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:18px}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.checkout input,.checkout textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px}.checkout button{width:100%;padding:13px;border:0;border-radius:9px;margin-top:8px;font-weight:700}.wa{background:#16a34a;color:#fff}.cod{background:#111827;color:#fff}.empty{text-align:center;padding:25px;color:#6b7280}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header class="top"><div class="brand">ZentraCart 🛍️</div><div class="tag">Smart Shopping. Better Deals.</div><div class="search"><input id="search" placeholder="Search products..."><button class="btn" onclick="filterProducts()">Search</button></div></header>
<nav class="nav"><button onclick="showAll()">All</button><button onclick="filterCat('Earbuds')">🎧 Earbuds</button><button onclick="filterCat('Smart Watch')">⌚ Smart Watch</button><button onclick="filterCat('Women')">👗 Women</button><button onclick="filterCat('Men')">👕 Men</button><button onclick="filterCat('Shoes')">👟 Shoes</button><button onclick="filterCat('Home')">🏠 Home</button></nav>
<main class="wrap"><section class="hero"><h1>Shop Smart. Shop ZentraCart.</h1><p>Trendy products, better deals and easy ordering.</p><button class="btn" onclick="document.getElementById('products').scrollIntoView()">Shop Now</button></section>
<div class="section"><h2>Categories</h2></div><div class="cats" id="cats"></div>
<div class="section"><h2>Featured Products</h2><span id="count"></span></div><div class="grid" id="products"></div>
</main><button class="cart" onclick="openCart()">🛒</button>
<div class="modal" id="modal" onclick="if(event.target===this)closeCart()"><div class="sheet"><div class="section"><h2>Your Cart</h2><button onclick="closeCart()">✕</button></div><div id="cart"></div><div id="checkout" class="checkout"></div></div></div>
<script>
const cats=[['🎧','Earbuds'],['🎵','Headphones'],['⌚','Smart Watch'],['👕','Men'],['👗','Women'],['👟','Shoes'],['📱','Mobile'],['🏠','Home'],['🧸','Toys'],['🔌','Electronics']];
const products=[
['Heavy Bass Earbuds','Earbuds',549,'🎧'],['T800 Ultra Smart Watch','Smart Watch',899,'⌚'],['Women Printed Anarkali Set','Women',999,'👗'],['Wireless TWS Earbuds','Earbuds',399,'🎧'],['Phone Holder Foldable','Mobile',204,'📱'],['Bluetooth Headphones','Headphones',699,'🎵'],['Men Casual T-Shirt','Men',499,'👕'],['Women Casual Kurti','Women',699,'👗'],['Sports Shoes','Shoes',899,'👟'],['Smart Watch Calling','Smart Watch',899,'⌚'],['Mobile Stand','Mobile',249,'📱'],['Home Kitchen Organizer','Home',399,'🏠'],['Kids Toy Set','Toys',499,'🧸'],['Fast Charger','Electronics',349,'🔌'],['Data Cable','Electronics',199,'🔌'],['School Backpack','Home',599,'🎒']
];
let view=products, cart=JSON.parse(localStorage.getItem('zc_cart')||'[]');
function renderCats(){document.getElementById('cats').innerHTML=cats.map(c=>`<div class="cat" onclick="filterCat('${c[1]}')"><div>${c[0]}</div><b>${c[1]}</b></div>`).join('')}
function render(){document.getElementById('count').textContent=view.length+' products';document.getElementById('products').innerHTML=view.map((p,i)=>`<article class="card"><div class="pic">${p[3]}</div><h3>${p[0]}</h3><div class="price">₹${p[2]} <span class="old">₹${Math.round(p[2]*1.35)}</span></div><button class="add" onclick="add(${i})">Add to Cart</button></article>`).join('')||'<div class="empty">No products found.</div>'}
function filterCat(c){view=products.filter(p=>p[1]===c);render()}function showAll(){view=products;render()}function filterProducts(){let q=document.getElementById('search').value.toLowerCase();view=products.filter(p=>p[0].toLowerCase().includes(q)||p[1].toLowerCase().includes(q));render()}
function add(i){cart.push(view[i]);localStorage.setItem('zc_cart',JSON.stringify(cart));openCart()}
function openCart(){document.getElementById('modal').style.display='flex';let el=document.getElementById('cart');if(!cart.length){el.innerHTML='<div class="empty">Your cart is empty.</div>';document.getElementById('checkout').innerHTML='';return}let total=cart.reduce((s,p)=>s+p[2],0);el.innerHTML=cart.map((p,i)=>`<div class="row"><span>${p[3]} ${p[0]}</span><b>₹${p[2]} <button onclick="removeItem(${i})">✕</button></b></div>`).join('')+`<h3>Total: ₹${total}</h3>`;document.getElementById('checkout').innerHTML=`<h3>Checkout</h3><input id="name" placeholder="Full Name"><input id="phone" placeholder="Mobile Number"><textarea id="address" placeholder="Full Delivery Address"></textarea><input id="pin" placeholder="PIN Code"><button class="cod" onclick="order('COD')">Place COD Order</button><button class="wa" onclick="order('WhatsApp')">Order via WhatsApp</button>`}
function removeItem(i){cart.splice(i,1);localStorage.setItem('zc_cart',JSON.stringify(cart));openCart()}function closeCart(){document.getElementById('modal').style.display='none'}
function order(method){let n=document.getElementById('name').value,p=document.getElementById('phone').value,a=document.getElementById('address').value,pin=document.getElementById('pin').value;if(!n||!p||!a||!pin)return alert('Please fill all details.');let total=cart.reduce((s,x)=>s+x[2],0);let msg=`Hello ZentraCart!%0AOrder: ${cart.map(x=>x[0]).join(', ')}%0ATotal: ₹${total}%0AName: ${n}%0AMobile: ${p}%0AAddress: ${a}, ${pin}%0APayment: ${method}`;window.open('https://wa.me/?text='+msg,'_blank')}
renderCats();render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
</script></body></html>
